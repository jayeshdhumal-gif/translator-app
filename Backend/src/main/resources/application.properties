spring.application.name=translator-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/translator_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:myVeryStrongSecretKeyForTranslatorApp123456789}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

server.port=${PORT:8080}

# ==============================
# Blockchain Configuration
# ==============================

blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}

blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:31337}

blockchain.deployer-address=${BLOCKCHAIN_DEPLOYER_ADDRESS:0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266}

blockchain.deployer-private-key=${BLOCKCHAIN_DEPLOYER_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}

blockchain.token-address=${BLOCKCHAIN_TOKEN_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}

blockchain.payment-contract-address=${BLOCKCHAIN_PAYMENT_CONTRACT_ADDRESS:0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}